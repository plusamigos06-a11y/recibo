name: APK Imprimir
on:
  push:
    branches: [main]
    paths: ['imprimir.html', 'imprimir-android/**', '.github/workflows/imprimir-apk.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Copiar la app a la APK
        run: |
          mkdir -p imprimir-android/app/src/main/assets
          cp imprimir.html imprimir-android/app/src/main/assets/index.html
      - name: Compilar
        working-directory: imprimir-android
        run: gradle assembleDebug --no-daemon
      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp imprimir-android/app/build/outputs/apk/debug/app-debug.apk Imprimir.apk
          gh release delete apk-imprimir -y --cleanup-tag || true
          gh release create apk-imprimir Imprimir.apk --title "Imprimir (APK)" --notes "APK Imprimir: manda PDF y fotos a la impresora de la PC. Se puede usar desde Compartir."
