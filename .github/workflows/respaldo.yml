name: Respaldo Recibo v1
on:
  push:
    branches: [respaldo-recibo-v1]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Copiar la app a la APK
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html manifest.webmanifest icon-192.png icon-512.png android/app/src/main/assets/
      - name: Compilar
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Publicar respaldo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Recibo-v1.apk
          gh release delete recibo-v1 -y --cleanup-tag || true
          gh release create recibo-v1 Recibo-v1.apk --target "$GITHUB_SHA" --title "Recibo v1 (respaldo)" --notes "Copia guardada del proyecto Recibo (18/NOV/2026). Código en la rama respaldo-recibo-v1."
