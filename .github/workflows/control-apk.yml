name: APK Control de Recibo
on:
  push:
    branches: [main]
    paths: ['control/index.html', 'control/android/**', '.github/workflows/control-apk.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Copiar la app a la APK
        run: |
          mkdir -p control/android/app/src/main/assets
          cd control && cp index.html manifest.webmanifest icon-192.png icon-512.png android/app/src/main/assets/
      - name: Compilar
        working-directory: control/android
        run: gradle assembleDebug --no-daemon
      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp control/android/app/build/outputs/apk/debug/app-debug.apk Control-Recibo.apk
          gh release delete apk-control -y --cleanup-tag || true
          gh release create apk-control Control-Recibo.apk --title "Control de Recibo (APK)" --notes "APK de Control de Recibo para Android."
