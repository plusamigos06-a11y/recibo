<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Imprimir documento</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,Arial;background:#0f172a;color:#fff;margin:0;padding:18px;max-width:640px;margin:0 auto}
h1{margin:0 0 4px;font-size:24px}p.s{margin:0 0 14px;color:#94a3b8;font-size:14px}
input,button,select{font-size:18px;padding:12px;margin:5px 0;width:100%;border-radius:10px;border:0}
input{background:#fff;color:#111}button{background:#2563eb;color:#fff;font-weight:700}button.g{background:#475569}button:disabled{opacity:.5}
.card{background:#1e293b;border-radius:12px;padding:14px;margin:12px 0}
#st{padding:12px;border-radius:10px;background:#1e293b;margin:12px 0;font-size:16px;white-space:pre-wrap}.ok{background:#14532d!important}.err{background:#7f1d1d!important}
#th{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}#th img{width:100%;background:#fff;border-radius:6px}
label{font-size:14px;color:#cbd5e1}.row{display:flex;gap:10px;align-items:end}.row>div{flex:1}
</style></head><body>
<h1>🖨️ Imprimir documento</h1><p class="s">Manda un PDF o fotos a la impresora de la PC (sale sola).</p>

<div id="cfg" class="card" style="display:none">
  <b>Conexión (solo la primera vez)</b>
  <input id="u" placeholder="URL de Supabase"><input id="k" placeholder="Clave anon public"><input id="c" placeholder="Clave del almacén">
  <button id="sv">Guardar</button>
</div>

<div id="main" style="display:none">
  <input id="f" type="file" accept="application/pdf,image/*" multiple style="background:#1e293b;color:#fff">
  <div class="row"><div><label for="n">Copias</label><input id="n" type="number" min="1" max="10" value="1" inputmode="numeric"></div>
  <div><label for="q">Calidad</label><select id="q"><option value="1.6">Normal</option><option value="2.1">Alta (más lenta)</option><option value="1.2">Rápida</option></select></div></div>
  <div id="th"></div>
  <div id="st">Elige un PDF o una o varias fotos.</div>
  <button id="go" disabled>Enviar a imprimir</button>
  <button id="chg" class="g">Cambiar datos de conexión</button>
</div>

<script>
const KEY='recibo_print_cfg',PDFJS='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',WORKER='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
const $=s=>document.querySelector(s),st=$('#st');
function limpiaUrl(u){u=(u||'').trim();try{const m=u.match(/[?&]url=([^&]+)/);if(m)u=decodeURIComponent(m[1]);}catch(e){}const m2=u.match(/https:\/\/[a-z0-9]+\.supabase\.co/i);return m2?m2[0]:u.replace(/\/+$/,'');}
try{const m=location.hash.match(/cfg=([^&]+)/);if(m){const c=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));if(c.url&&c.key&&c.clave){localStorage.setItem(KEY,JSON.stringify(c));history.replaceState(null,'',location.pathname);}}}catch(e){}
function cfg(){try{const c=JSON.parse(localStorage.getItem(KEY)||'null');if(c&&c.url&&c.key&&c.clave){c.url=limpiaUrl(c.url);return c;}}catch(e){}return null;}
function show(){const c=cfg();$('#cfg').style.display=c?'none':'block';$('#main').style.display=c?'block':'none';}
$('#sv').onclick=()=>{const c={url:limpiaUrl($('#u').value),key:$('#k').value.trim(),clave:$('#c').value.trim()};if(!c.url||!c.key||!c.clave){alert('Faltan datos.');return;}localStorage.setItem(KEY,JSON.stringify(c));show();};
$('#chg').onclick=()=>{const c=cfg()||{};$('#u').value=c.url||'';$('#k').value=c.key||'';$('#c').value=c.clave||'';localStorage.removeItem(KEY);show();};
show();

let pages=[];   // data URLs jpeg
let titulo='Documento';
const say=(m,c)=>{st.textContent=m;st.className=c||'';};
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('No se pudo cargar el lector de PDF (revisa internet)'));document.head.appendChild(s);});}
async function pdfPages(file,scale){
  if(!window.pdfjsLib){await loadScript(PDFJS);}
  if(!pdfjsLib.GlobalWorkerOptions.workerSrc){const t=await (await fetch(WORKER)).text();pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([t],{type:'text/javascript'}));}
  const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;const out=[];
  if(doc.numPages>40)throw new Error('El PDF tiene '+doc.numPages+' páginas; el máximo es 40.');
  for(let i=1;i<=doc.numPages;i++){
    say('Preparando página '+i+' de '+doc.numPages+'…');
    const pg=await doc.getPage(i),vp=pg.getViewport({scale:scale*96/72*(1.0)});
    const cv=document.createElement('canvas');cv.width=Math.ceil(vp.width);cv.height=Math.ceil(vp.height);
    const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);
    await pg.render({canvasContext:cx,viewport:vp}).promise;out.push(cv.toDataURL('image/jpeg',.85));
  }
  return out;
}
function imgPage(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const M=2200,k=Math.min(1,M/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);
    const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);ok(cv.toDataURL('image/jpeg',.85));};
  im.onerror=()=>no(new Error('No se pudo leer la imagen '+file.name));im.src=u;});}
$('#f').onchange=async e=>{
  const fs=[...e.target.files];pages=[];$('#th').innerHTML='';$('#go').disabled=true;if(!fs.length)return;
  titulo=fs.length===1?fs[0].name:fs.length+' archivos';
  try{
    const sc=parseFloat($('#q').value);
    for(const f of fs){
      if(f.type==='application/pdf'||/\.pdf$/i.test(f.name))pages.push(...await pdfPages(f,sc));
      else if(f.type.startsWith('image/'))pages.push(await imgPage(f));
      else throw new Error('Tipo no admitido: '+f.name+'. Usa PDF o fotos (Word/Excel: guárdalo como PDF primero).');
    }
    if(pages.length>40)throw new Error('Son '+pages.length+' páginas; el máximo es 40.');
    $('#th').innerHTML=pages.map(p=>'<img src="'+p+'">').join('');
    const mb=pages.reduce((a,p)=>a+p.length,0)/1e6;
    say(pages.length+' página(s) lista(s) · '+mb.toFixed(1)+' MB','ok');$('#go').disabled=false;
  }catch(err){pages=[];say('⚠ '+err.message,'err');}
};
function docHtml(){
  const css='@page{size:letter;margin:.25in}*{box-sizing:border-box}html,body{margin:0;background:#fff}.p{width:8in;height:10.45in;display:flex;align-items:center;justify-content:center;page-break-after:always;break-after:page;overflow:hidden}.p:last-child{page-break-after:auto;break-after:auto}.p img{max-width:100%;max-height:100%;object-fit:contain}';
  return '<!doctype html><html><head><meta charset="utf-8"><style>'+css+'</style></head><body>'+pages.map(p=>'<div class="p"><img src="'+p+'"></div>').join('')+'</body></html>';
}
$('#go').onclick=async()=>{
  const c=cfg();if(!c||!pages.length)return;const n=Math.max(1,Math.min(10,parseInt($('#n').value)||1));
  $('#go').disabled=true;say('Enviando…');
  try{
    const html=docHtml(),H=Object.assign({apikey:c.key,'Content-Type':'application/json',Prefer:'return=minimal'},c.key.startsWith('sb_')?{}:{Authorization:'Bearer '+c.key});
    for(let i=0;i<n;i++){
      const r=await fetch(c.url+'/rest/v1/cola_impresion',{method:'POST',headers:H,body:JSON.stringify({clave:c.clave,titulo:(titulo+(n>1?' ('+(i+1)+'/'+n+')':'')).slice(0,120),html})});
      if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,140));
    }
    say('✅ Enviado ('+n+' copia'+(n>1?'s':'')+'). Sale en la impresora de la PC en unos segundos.','ok');
  }catch(err){say('⚠ No se pudo enviar: '+err.message+(/Failed to fetch|NetworkError/i.test(err.message)?' (puede ser un archivo muy grande o sin internet)':''),'err');}
  $('#go').disabled=false;
};
</script></body></html>
