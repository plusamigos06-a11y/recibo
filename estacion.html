<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estación de impresión</title>
<style>body{font-family:system-ui,Arial;background:#0f172a;color:#fff;margin:0;padding:24px}h1{margin:0 0 8px}#st{font-size:22px;padding:14px;border-radius:10px;background:#1e293b;margin:12px 0}
.ok{background:#14532d!important}.err{background:#7f1d1d!important}input,button{font-size:18px;padding:10px;margin:4px 0;width:100%;max-width:520px;box-sizing:border-box;border-radius:8px;border:0}button{background:#2563eb;color:#fff;font-weight:700}
#log{font-size:15px;color:#cbd5e1;white-space:pre-wrap}</style></head><body>
<h1>🖨️ Estación de impresión</h1>
<div id="cfg"><input id="u" placeholder="URL de Supabase"><input id="k" placeholder="Clave anon public"><input id="c" placeholder="Clave del almacén"><button id="sv">Guardar y empezar</button></div>
<div id="st">Iniciando…</div><div id="log"></div>
<iframe id="fr" style="position:absolute;left:-9999px;width:8.5in;height:11in;border:0"></iframe>
<script>
try{const m=location.hash.match(/cfg=([^&]+)/);if(m){const c=JSON.parse(decodeURIComponent(escape(atob(m[1]))));if(c.url&&c.key&&c.clave){localStorage.setItem('estacion_cfg',JSON.stringify(c));history.replaceState(null,'',location.pathname);}}}catch(e){}
const K='estacion_cfg';let cfg=null;try{cfg=JSON.parse(localStorage.getItem(K)||'null');}catch(e){}
const $=s=>document.querySelector(s),st=$('#st'),log=m=>{$('#log').textContent=new Date().toLocaleTimeString()+'  '+m+'\n'+$('#log').textContent.slice(0,1500);};
$('#sv').onclick=()=>{cfg={url:$('#u').value.trim().replace(/\/+$/,''),key:$('#k').value.trim(),clave:$('#c').value.trim()};localStorage.setItem(K,JSON.stringify(cfg));location.reload();};
let busy=false;
const H=()=>Object.assign({apikey:cfg.key,'Content-Type':'application/json'},cfg.key.startsWith('sb_')?{}:{Authorization:'Bearer '+cfg.key});
function imprimir(html){return new Promise(res=>{const f=$('#fr');f.onload=()=>{setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print();}catch(e){log('Error imprimiendo: '+e.message);}setTimeout(res,2500);},600);};f.srcdoc=html;});}
async function tick(){
  if(busy)return;busy=true;
  try{
    const r=await fetch(cfg.url+'/rest/v1/cola_impresion?estado=eq.pendiente&clave=eq.'+encodeURIComponent(cfg.clave)+'&order=id.asc&limit=1',{headers:H()});
    if(!r.ok)throw new Error(r.status);
    st.className='ok';st.textContent='✅ Conectada y esperando trabajos… (deja esta página abierta)';
    const j=await r.json();
    if(j.length){
      const t=j[0];st.textContent='Imprimiendo: '+(t.titulo||t.id);
      const u=await fetch(cfg.url+'/rest/v1/cola_impresion?id=eq.'+t.id+'&estado=eq.pendiente',{method:'PATCH',headers:{...H(),Prefer:'return=representation'},body:JSON.stringify({estado:'imprimiendo'})});
      const got=await u.json();
      if(got.length){await imprimir(t.html);await fetch(cfg.url+'/rest/v1/cola_impresion?id=eq.'+t.id,{method:'PATCH',headers:H(),body:JSON.stringify({estado:'impreso'})});log('Impreso: '+(t.titulo||t.id));}
    }
  }catch(e){st.className='err';st.textContent='⚠ Sin conexión con la base de datos ('+e.message+'). Reintentando…';}
  busy=false;
}
if(cfg&&cfg.url){$('#cfg').style.display='none';tick();setInterval(tick,3000);}else{st.textContent='Escribe los datos de conexión.';}
</script></body></html>
